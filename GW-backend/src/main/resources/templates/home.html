<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="">
  <head>
    <meta charset="UTF-8" />
    <title>Hello TUK</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 400px;
        margin: 50px auto;
        padding: 20px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #333;
        text-align: center;
        margin-bottom: 30px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
        color: #666;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        border-color: #4caf50;
        outline: none;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
      }

      button:hover {
        background-color: #45a049;
      }

      p {
        text-align: center;
        margin-top: 20px;
      }

      a {
        color: #4caf50;
        text-decoration: none;
        margin: 0 10px;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div>
        <h1>Hello TUK</h1>
        <p>회원 기능</p>
        <form action="/users/login" method="post">
          <div class="form-group">
            <label for="name">이름</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="이름을 입력하세요"
            />
          </div>
          <div class="form-group">
            <label for="password">비밀번호</label>
            <input
              type="text"
              id="password"
              name="password"
              placeholder="비밀번호를 입력하세요"
            />
          </div>
          <button type="submit">로그인</button>
        </form>
        <p>
          <a href="/users/new">회원 가입</a>
          <a href="/users">회원 목록</a>
        </p>
      </div>
    </div>
    <!-- /container -->
  </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>파일 업로드</title>
    <style>
      /* 진행 상태 표시를 위한 오버레이 스타일 */
      #progressOverlay {
        display: none; /* 기본적으로 숨김 */
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        text-align: center;
        padding-top: 20%;
        font-size: 1.5em;
        z-index: 1000;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 20px;
        color: #333;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      h2,
      h3,
      h4 {
        color: #2c3e50;
        margin-bottom: 20px;
      }

      form {
        margin: 20px 0;
        padding: 20px;
        border: 2px dashed #ddd;
        border-radius: 8px;
        text-align: center;
      }

      input[type="file"] {
        display: block;
        margin: 0 auto 15px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        width: 80%;
        max-width: 400px;
      }

      button {
        padding: 10px 20px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }

      button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }

      button:hover:not(:disabled) {
        background-color: #45a049;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background-color: white;
      }

      th,
      td {
        padding: 12px;
        text-align: left;
        border: 1px solid #ddd;
      }

      th {
        background-color: #4caf50;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      tr:hover {
        background-color: #f5f5f5;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        margin: 5px 0;
        color: #666;
      }

      #progressOverlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        text-align: center;
        padding-top: 20%;
        font-size: 1.5em;
        z-index: 1000;
      }

      .analysis-section {
        margin: 20px 0;
        padding: 15px;
        background-color: #f8f9fa;
        border-radius: 8px;
      }

      pre {
        background-color: #f8f9fa;
        padding: 10px;
        border-radius: 4px;
        overflow-x: auto;
      }

      .message {
        padding: 10px;
        margin: 10px 0;
        border-radius: 4px;
        background-color: #e3f2fd;
        color: #1565c0;
      }

      @media (max-width: 600px) {
        .container {
          padding: 10px;
        }

        table {
          font-size: 14px;
        }

        th,
        td {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <h2>FastAPI로 MP4 파일 업로드</h2>

    <!-- 전통적인 서버 사이드 렌더링 방식으로 전송 -->
    <form
      id="uploadForm"
      action="/upload"
      method="post"
      enctype="multipart/form-data"
      onsubmit="showProgress()"
    >
      <input type="file" id="file" name="file" accept="video/mp4" required />
      <button type="submit" id="uploadBtn" disabled>업로드</button>
    </form>

    <!-- 진행 상태 오버레이 -->
    <div id="progressOverlay">파일 분석 중입니다. 잠시만 기다려주세요...</div>

    <!-- 서버에서 전달된 message -->
    <p th:text="${message}"></p>

    <!-- 분석 결과 표시 예시 -->
    <div>
      <h3>분석 결과</h3>
      <!-- 분석된 파일 이름 -->
      <p>파일 이름: <span th:text="${analysisFilename}">No File</span></p>

      <!-- 말하기 속도 정보: speakingSpeed가 Map/JSON 형태라면, 간단히 전체를 출력하거나 세부 항목을 골라서 출력 -->
      <h4>말하기 속도</h4>
      <pre th:text="${speakingSpeed}">No speed data</pre>

      <h4>말하기 속도 평가</h4>
      <pre th:text="${speakingEvaluation}">No speed data</pre>

      <!-- 음량 분석 정보: volumeAnalysis가 Map/JSON 형태라면 마찬가지로 출력 -->
      <h4>음량 분석</h4>
      <pre th:text="${volumeAnalysis}">No volume data</pre>

      <h4>음량 분석 평가</h4>
      <pre th:text="${volumeEvaluation}">No volume data</pre>

      <h4>비언어적 표현 분석</h4>
      <table border="1">
        <thead>
          <tr>
            <th>샘플 번호</th>
            <th>시간 구간</th>
            <th>정상 여부</th>
            <th>상위 행동 분석</th>
          </tr>
        </thead>
        <tbody>
          <!-- 반복문 데이터 출력 -->
          <tr th:each="analysis : ${nonverbalAnalysis}">
            <td th:text="${analysis.value.sample_number}">-</td>
            <td th:text="${analysis.value.time_range}">-</td>
            <td th:text="${analysis.value.is_normal} ? '정상' : '비정상'">-</td>
            <td>
              <!-- 비정상인 경우 top_classes 표시 -->
              <ul th:if="${!analysis.value.is_normal}">
                <li th:each="classInfo : ${analysis.value.top_classes}">
                  <span th:text="${classInfo.class}"></span> (<span
                    th:text="${classInfo.probability}"
                  ></span
                  >%)
                </li>
              </ul>
              <span th:if="${analysis.value.is_normal}">-</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script>
      // 파일 선택 시 업로드 버튼 활성화
      document.getElementById("file").addEventListener("change", function () {
        document.getElementById("uploadBtn").disabled = !this.files.length;
      });

      // 폼 제출 시 진행 상태 오버레이 표시
      function showProgress() {
        document.getElementById("progressOverlay").style.display = "block";
      }
    </script>
  </body>
</html>

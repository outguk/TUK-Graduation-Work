plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'TUK-Graduation-Work'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(23)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
//	implementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// MultipartFile 지원 (파일 업로드 처리)
	implementation 'commons-fileupload:commons-fileupload:1.5'

	// JSON 파싱 (FastAPI 서버 응답 처리)
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.0'

	// Spring Boot DevTools (개발 편의성)
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// 기존 Spring Web 대신 Spring WebFlux 사용
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Reactor Core (비동기 프로그래밍을 위한 필수 라이브러리)
	implementation 'io.projectreactor:reactor-core:3.6.0'

	// (선택 사항) 로그 출력을 위한 Reactor Tools
	implementation 'io.projectreactor.tools:blockhound:1.0.6.RELEASE'
}

tasks.named('test') {
	useJUnitPlatform()
}
